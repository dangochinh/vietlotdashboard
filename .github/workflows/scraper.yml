name: Vietlott Daily Scraper

on:
  schedule:
    # Run at 19:30 VNT every day (12:30 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: write
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      working-directory: ./scraper
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Scraper
      working-directory: ./scraper
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        python main.py

    - name: Keepalive Workflow (Prevent 60-day inactivity disable)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        LAST_COMMIT_DATE=$(git log -1 --format=%ct)
        CURRENT_DATE=$(date +%s)
        DAYS_SINCE=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
        if [ "$DAYS_SINCE" -gt 50 ]; then
          git commit --allow-empty -m "chore: keepalive workflow automated commit"
          git push
          echo "Keepalive commit pushed (last commit was $DAYS_SINCE days ago)"
        else
          echo "No keepalive needed (last commit was $DAYS_SINCE days ago)"
        fi
